<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northern Trail | Cinematic</title>
  <script>
    (function () {
      var ar = new URLSearchParams(location.search).get('lang') === 'ar';
      var h = document.documentElement;
      h.lang = ar ? 'ar' : 'en';
      h.dir = ar ? 'rtl' : 'ltr';
      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      var seen = false;
      try { seen = sessionStorage.getItem('ntc-intro') === '1'; } catch (e) {}
      if (!seen && !reduced && !/[?&]intro=0/.test(location.search)) h.classList.add('is-loading');
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    })();
  </script>
  <link rel="icon" href="data:,">
  <link rel="preload" href="../assets/fonts/bukra-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/brand.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="host-bar">webook</div>

  <div class="nt ntc" id="ntc">

    <!-- Loader: film leader in brand colours, once per session -->
    <div class="ntc-loader" aria-hidden="true">
      <div class="ntc-loader__shutter">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="ntc-loader__content">
        <span class="ntc-loader__mark ntc-loader__mark--ts"></span>
        <span class="ntc-loader__mark ntc-loader__mark--te"></span>
        <span class="ntc-loader__mark ntc-loader__mark--bs"></span>
        <span class="ntc-loader__mark ntc-loader__mark--be"></span>
        <div class="ntc-loader__top">
          <span class="ntc-loader__label" data-l="reel"></span>
          <span class="ntc-loader__count"><b>3</b></span>
        </div>
        <div class="ntc-loader__center">
          <img class="ntc-loader__logo" src="../assets/svg/logo-cream.svg" alt="" width="296" height="165">
          <div class="ntc-loader__line"><span></span></div>
          <div class="ntc-loader__meta">
            <span data-l="loading"></span>
            <span class="ntc-loader__frames"><b>000</b> / 096</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Hero: the film plays inside the word -->
    <section class="ntc-hero" data-section="hero">
      <div class="ntc-hero__stage">
        <div class="ntc-hero__film" data-cursor="film">
        <video class="ntc-hero__video" muted playsinline loop preload="auto"></video>
        <div class="ntc-hero__scrim"></div>
        <canvas class="ntc-hero__mask" aria-hidden="true"></canvas>
        <div class="ntc-hero__chrome">
          <div class="ntc-hero__top">
            <img class="ntc-hero__logo" src="../assets/svg/logo-cream.svg" alt="" width="296" height="165">
            <nav class="ntc-lang" aria-label="Language">
              <a href="?lang=en" hreflang="en" lang="en" data-magnetic>EN</a>
              <a href="?lang=ar" hreflang="ar" lang="ar" data-magnetic>عربي</a>
            </nav>
          </div>
          <div class="ntc-hero__slate ntc-hero__slate--above">
            <span data-l="reelFilm"></span>
            <span class="ntc-hero__tc" dir="ltr">00:00:00:00</span>
          </div>
          <div class="ntc-hero__slate ntc-hero__slate--below">
            <span class="ntc-hero__route-a"></span>
            <span class="ntc-hero__route-km"></span>
            <span class="ntc-hero__route-b"></span>
          </div>
          <div class="ntc-hero__cue">
            <span data-l="scroll"></span><i></i>
          </div>
        </div>
        <button class="ntc-pause" type="button" aria-pressed="false" data-magnetic>
          <svg class="ntc-pause__i-pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4h3v12H6zM11 4h3v12h-3z" fill="currentColor"/></svg>
          <svg class="ntc-pause__i-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z" fill="currentColor"/></svg>
          <span class="ntc-sr"></span>
        </button>
        </div>
        <div class="ntc-hero__copy">
          <h1 class="ntc-hero__title"></h1>
          <p class="ntc-hero__sub"></p>
          <a class="nt-btn nt-btn--light ntc-hero__cta" href="#stops" data-magnetic>
            <span></span>
            <svg class="nt-flip" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          </a>
        </div>
      </div>
    </section>

    <!-- Intro: typographic interlude -->
    <section class="ntc-intro" data-section="intro">
      <div class="nt-wrap">
        <div class="ntc-intro__head">
          <p class="nt-eyebrow ntc-intro__eyebrow" data-l="intro"></p>
          <h2 class="ntc-intro__title"></h2>
          <p class="ntc-intro__body"></p>
        </div>
        <ol class="ntc-stats"></ol>
      </div>
    </section>

    <!-- Chapters: the three pillars -->
    <section class="ntc-chapters" data-section="chapters">
      <div class="ntc-chapters__stage">
        <div class="ntc-chapters__edge" aria-hidden="true"></div>
      </div>
    </section>

    <!-- Stops: horizontal reel -->
    <section class="ntc-stops" id="stops" data-section="stops">
      <div class="ntc-stops__stage">
        <header class="ntc-stops__head nt-wrap">
          <div class="ntc-stops__titles">
            <p class="nt-eyebrow ntc-stops__eyebrow"></p>
            <h2 class="ntc-stops__title" data-l="stops"></h2>
          </div>
          <div class="ntc-stops__status">
            <p class="ntc-stops__counter" aria-live="polite"></p>
            <p class="ntc-stops__hint"><span data-l="hint"></span></p>
          </div>
        </header>
        <div class="ntc-stops__viewport" data-cursor="drag">
          <ol class="ntc-stops__track"></ol>
        </div>
        <div class="ntc-stops__progress nt-wrap" aria-hidden="true"><span><i></i></span></div>
      </div>
    </section>

    <!-- Practical: tours, stays, tips, FAQs as reels, contact sheet, credits and scene list -->
    <div class="ntc-info" data-section="practical"></div>

    <!-- Closing -->
    <section class="ntc-closing" data-section="closing">
      <div class="ntc-closing__stickers" aria-hidden="true"></div>
      <div class="nt-wrap ntc-closing__inner">
        <p class="ntc-closing__tag" lang="ar" dir="rtl"><span></span></p>
        <p class="ntc-closing__line" data-reveal></p>
        <img class="ntc-closing__logo" src="../assets/svg/logo-dark.svg" alt="" width="296" height="165" data-reveal>
      </div>
    </section>

    <div class="ntc-grain" aria-hidden="true"></div>
    <div class="ntc-cursor" aria-hidden="true"><i class="ntc-cursor__box"></i><span class="ntc-cursor__label"></span></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
