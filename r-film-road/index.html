<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northern Trail | Film and road</title>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var ar = p.get('lang') === 'ar';
      var h = document.documentElement;
      h.lang = ar ? 'ar' : 'en';
      h.dir = ar ? 'rtl' : 'ltr';
      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches || p.has('reduced');
      if (reduced) h.classList.add('is-reduced-motion');
      if (!reduced && !p.has('nointro')) h.classList.add('is-loading');
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    })();
  </script>
  <link rel="icon" href="data:,">
  <link rel="preload" href="../assets/fonts/bukra-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/brand.css">
  <link rel="stylesheet" href="style.css?v=23">
  <link rel="stylesheet" href="book.css?v=5">
  <link rel="stylesheet" href="postcards.css?v=6">
  <link rel="stylesheet" href="webook.css?v=3">
  <link rel="stylesheet" href="bundles.css?v=1">
  <link rel="stylesheet" href="trip.css?v=2">
</head>
<body>
  <header class="nt wb-nav" id="wb-nav"></header>

  <div class="nt ntc" id="ntc">

    <!-- Intro: the film plays inside the word while the page loads, then the camera dives
         into a letter until the film fills the screen and becomes the hero. -->
    <div class="r-intro">
      <canvas class="r-intro__mask" aria-hidden="true"></canvas>
      <div class="r-intro__chrome">
        <span class="ntc-loader__mark ntc-loader__mark--ts"></span>
        <span class="ntc-loader__mark ntc-loader__mark--te"></span>
        <span class="ntc-loader__mark ntc-loader__mark--bs"></span>
        <span class="ntc-loader__mark ntc-loader__mark--be"></span>
        <div class="r-intro__slate r-intro__slate--above">
          <span data-l="reelFilm"></span>
          <span class="r-intro__tc" dir="ltr">00:00:00:00</span>
        </div>
        <div class="r-intro__slate r-intro__slate--below">
          <span class="r-intro__route-a"></span>
          <span class="r-intro__line"><i></i></span>
          <span class="r-intro__route-b"></span>
        </div>
        <button class="r-intro__skip" type="button"><span data-l="skip"></span><svg class="nt-flip" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4l7 6-7 6zM11 4l7 6-7 6z" fill="currentColor"/></svg></button>
      </div>
    </div>

    <!-- Hero: the brand film, full bleed -->
    <section class="r-hero" data-section="hero" aria-labelledby="r-hero-title">
      <div class="r-hero__stage">
        <video class="r-hero__video" muted playsinline loop preload="auto"></video>
        <div class="r-hero__scrim"></div>
        <div class="r-hero__top nt-wrap">
          <img class="r-hero__logo" src="../assets/svg/logo-cream.svg" alt="" width="296" height="165">
          <p class="r-hero__route"><span class="r-hero__route-a"></span><i></i><span class="r-hero__route-km"></span><i></i><span class="r-hero__route-b"></span></p>
        </div>
        <div class="r-hero__copy nt-wrap">
          <h1 class="r-hero__title" id="r-hero-title"></h1>
          <p class="r-hero__sub"></p>
          <a class="nt-btn nt-btn--light r-hero__cta" href="#stops">
            <span></span>
            <svg class="nt-flip" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          </a>
        </div>
        <div class="r-hero__foot nt-wrap">
          <p class="ntc-hero__cue"><span data-l="scroll"></span><i></i></p>
          <button class="ntc-pause" type="button" aria-pressed="false">
            <svg class="ntc-pause__i-pause" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4h3v12H6zM11 4h3v12h-3z" fill="currentColor"/></svg>
            <svg class="ntc-pause__i-play" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4l10 6-10 6z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </section>

    <div class="sadu sadu--stone" aria-hidden="true"></div>
    <!-- What is the Northern Trail? (F's layout, H's pillar cards) -->
    <section class="ab" id="about" aria-labelledby="ab-title"></section>

    <div class="sadu sadu--deep" aria-hidden="true"></div>
    <!-- Stops: horizontal reel, a car drives the road underneath -->
    <section class="ntc-stops" id="stops" data-section="stops" aria-labelledby="r-stops-title">
      <div class="ntc-stops__stage">
        <header class="ntc-stops__head nt-wrap">
          <div class="ntc-stops__titles">
            <p class="nt-eyebrow ntc-stops__eyebrow"></p>
            <h2 class="ntc-stops__title" id="r-stops-title" data-l="stops"></h2>
          </div>
          <div class="ntc-stops__status">
            <p class="ntc-stops__counter" aria-live="polite"></p>
            <p class="ntc-stops__hint"><span data-l="hint"></span></p>
          </div>
        </header>
        <div class="ntc-stops__viewport">
          <ol class="ntc-stops__track"></ol>
        </div>
        <div class="r-road nt-wrap" aria-hidden="true">
          <div class="r-road__in">
            <svg class="r-road__svg"></svg>
            <div class="r-road__nodes"></div>
            <div class="r-car"><div class="r-car__flip"></div></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Booking: tours as option E's postcards, stays as plain webook listings -->
    <section class="pp pp--tours post" id="tours" aria-labelledby="pp-tours-t"></section>
    <section class="bk bk--stays" id="stays" aria-labelledby="bk-stays-title"></section>
    <!-- Trip bundles: an experience and a stay together -->
    <section class="bn" id="bundles" aria-labelledby="bn-title"></section>

    <!-- Before you go + FAQs (from direction G) -->
    <div class="sadu sadu--green" aria-hidden="true"></div>
    <section class="px px--tips" id="tips"></section>
    <section class="px px--faq" id="faq"></section>

    <div class="sadu sadu--cream" aria-hidden="true"></div>
    <!-- Closing -->
    <section class="ntc-closing" data-section="closing" aria-label="Northern Trail">
      <div class="ntc-closing__stickers" aria-hidden="true"></div>
      <div class="nt-wrap ntc-closing__inner">
        <p class="ntc-closing__tag" lang="ar" dir="rtl"><span></span></p>
        <p class="ntc-closing__line" data-reveal></p>
        <img class="ntc-closing__logo" src="../assets/svg/logo-dark.svg" alt="" width="296" height="165" data-reveal>
      </div>
    </section>

    <div class="ntc-grain" aria-hidden="true"></div>
  </div>

  <footer class="nt wb-foot" id="wb-foot"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="module" src="js/main.js?v=24"></script>
</body>
</html>
