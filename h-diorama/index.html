<link rel="icon" href="data:,">
<script>
  /* set language + direction before first paint */
  (function () {
    var ar = new URLSearchParams(location.search).get('lang') === 'ar';
    document.documentElement.lang = ar ? 'ar' : 'en';
    document.documentElement.dir = ar ? 'rtl' : 'ltr';
    var rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var seen = false;
    try { seen = sessionStorage.getItem('nt-h-loader') === '1'; } catch (e) {}
    document.documentElement.classList.add(rm ? 'is-rm' : 'is-motion');
    if (!rm && !seen) document.documentElement.classList.add('is-loading');
  })();
</script>
<link rel="preload" href="../assets/content.json" as="fetch" crossorigin>

  </nav>
