<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northern Trail Star Navigation</title>
  <meta name="theme-color" content="#0c0a12">
  <link rel="icon" href="data:,">
  <link rel="preload" href="../assets/fonts/bukra-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/content.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="../assets/brand.css">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var ar = p.get('lang') === 'ar';
      var d = document.documentElement;
      d.lang = ar ? 'ar' : 'en';
      d.dir = ar ? 'rtl' : 'ltr';
      var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches || p.has('reduced');
      var seen = false;
      try { seen = sessionStorage.getItem('nt-m-stars-intro') === '1'; } catch (e) {}
      if (p.has('intro')) seen = false;
      if (reduced) d.classList.add('is-reduced');
      if (!reduced && !seen && !p.has('nointro')) d.classList.add('has-loader');
      else d.classList.add('is-ready');
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="host-bar">
    <span class="host-bar__brand">webook</span>
    <nav class="lang" aria-label="Language">
      <a class="lang__btn" data-lang="en" href="?lang=en" hreflang="en" lang="en">EN</a>
      <a class="lang__btn" data-lang="ar" href="?lang=ar" hreflang="ar" lang="ar">AR</a>
    </nav>
  </div>

  <!-- Loading moment: the sky fades in, the 16 stars ignite along the route, then the
       planisphere aperture opens onto the page. -->
  <div class="m-loader" id="loader" aria-hidden="true"></div>

  <div class="nt m-page" id="app">
    <main>
      <section class="hero" id="hero" aria-labelledby="hero-title"></section>
      <section class="intro" id="intro" aria-labelledby="intro-title"></section>
      <section class="pillars" id="pillars" aria-labelledby="pillars-title"></section>
      <section class="chart" id="stops" aria-labelledby="stops-title"></section>
      <section class="px px--tours" id="tours" aria-labelledby="tours-title"></section>
      <section class="px px--stays" id="stays" aria-labelledby="stays-title"></section>
      <section class="px px--tips" id="tips" aria-labelledby="tips-title"></section>
      <section class="px px--faq" id="faq" aria-labelledby="faq-title"></section>
      <section class="closing" id="closing" aria-labelledby="closing-title"></section>
    </main>
  </div>
</body>
</html>
